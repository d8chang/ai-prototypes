<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>14-Day Trial Funnel – prototype</title>
<style>
  /* Theme tokens. The dashboard styles below read these names. */
  :root { color-scheme: light; --color-fg:#0b0b0b;--color-fg-muted:#6f6d68;--color-bg:#f6f6f3;--color-panel:#fcfcfb;--color-border-line:#e1e0d9;--cds-text-secondary:#52514e;--cds-border:#c9c8c0;--cds-surface-popover:#ffffff;--cds-chart-muted:#cfcec7;--cds-chart-grid:#e9e8e2;--cds-chart-axis:#c3c2b7;--cds-chart-reference:#898781;--c1:#2a78d6;--c2:#eb6834;--c3:#1baf7a;--c4:#eda100;--c5:#e87ba4;--c6:#008300;--c7:#6250d6;--c8:#e34948;
    --color-bad:#d03b3b;
    --font-anthropic-sans: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --font-anthropic-serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
    --cds-radius:8px; --cds-pad-xs:4px; --cds-pad-sm:8px; --cds-pad-md:12px; --cds-pad-lg:16px;
    --cds-gap-xs:4px; --cds-gap-sm:8px; --cds-gap-md:12px; --cds-gap-lg:20px;
    --cds-font-size-caption:12px; --cds-font-size-body:14px; --cds-font-size-heading:15px; --cds-font-weight-medium:500;
    --cds-shadow-popover:0 4px 16px rgba(0,0,0,.16); --cds-dur-slow:.3s; --cds-dur-fast:.1s; }
  @media (prefers-color-scheme: dark) { :root { color-scheme: dark; --color-fg:#f0efec;--color-fg-muted:#9a9892;--color-bg:#0d0d0d;--color-panel:#1a1a19;--color-border-line:#2c2c2a;--cds-text-secondary:#c3c2b7;--cds-border:#44443f;--cds-surface-popover:#242422;--cds-chart-muted:#4a4a46;--cds-chart-grid:#2c2c2a;--cds-chart-axis:#383835;--cds-chart-reference:#898781;--c1:#3987e5;--c2:#d95926;--c3:#199e70;--c4:#c98500;--c5:#d55181;--c6:#008300;--c7:#9085e9;--c8:#e66767; } }
  *, *::before, *::after { box-sizing: border-box; }
  body { margin: 0; background: var(--color-bg); color: var(--color-fg); -webkit-font-smoothing: antialiased; }
  [hidden] { display: none !important; }
  .tf-shell { max-width: 1280px; margin: 0 auto; padding: 28px 20px 56px; }
  @media (max-width: 480px) { .tf-shell { padding-inline: 16px; } }
</style>
<style>
  /* Layout: filters on top, headline figures, one large path chart, then metric trends with a breakdown, then the trial rows every click above narrows. */
  .tf-page { display: flex; flex-direction: column; gap: var(--cds-gap-lg); font-family: var(--font-anthropic-sans); font-size: var(--cds-font-size-body); color: var(--color-fg); font-variant-numeric: tabular-nums; container-type: inline-size; min-width: 0; }
  .tf-head { display: flex; flex-direction: column; gap: var(--cds-gap-xs); }
  .tf-headrow { display: flex; flex-wrap: wrap; align-items: baseline; gap: var(--cds-gap-sm); }
  .tf-title { font-family: var(--font-anthropic-serif); font-weight: 400; font-size: 1.75rem; line-height: 1.15; margin: 0; text-wrap: balance; }
  .tf-sample { font-size: var(--cds-font-size-caption); color: var(--color-fg-muted); border: 1px solid var(--color-border-line); border-radius: 999px; padding: 0.1rem 0.6rem; white-space: nowrap; }
  .tf-takeaway { margin: 0; color: var(--cds-text-secondary); max-width: 68ch; line-height: 1.45; }

  .tf-row { display: flex; flex-wrap: wrap; align-items: center; gap: var(--cds-gap-sm) var(--cds-gap-md); }
  .tf-field { display: inline-flex; align-items: center; gap: var(--cds-gap-xs); font-size: var(--cds-font-size-caption); color: var(--color-fg-muted); }
  .tf-input { font: inherit; font-size: var(--cds-font-size-caption); color: var(--color-fg); background: var(--color-panel); border: 1px solid var(--color-border-line); border-radius: var(--cds-radius); padding: 0.3rem 0.5rem; min-height: 1.9rem; max-width: 100%; }
  .tf-input:focus-visible, .tf-btn:focus-visible, .tf-kpi:focus-visible, .tf-leg:focus-visible, .tf-chip:focus-visible, .tf-sort:focus-visible, .tf-rowbtn:focus-visible { outline: 2px solid var(--color-fg); outline-offset: 1px; }
  .tf-btn { font: inherit; font-size: var(--cds-font-size-caption); color: var(--color-fg); background: var(--color-panel); border: 1px solid var(--color-border-line); border-radius: var(--cds-radius); padding: 0.3rem 0.65rem; min-height: 1.9rem; cursor: pointer; }
  .tf-btn:hover { background: color-mix(in srgb, var(--color-fg) 6%, var(--color-panel)); }
  .tf-btn[aria-pressed="true"] { background: var(--color-fg); color: var(--color-bg); border-color: var(--color-fg); }
  .tf-seg { display: inline-flex; }
  .tf-seg .tf-btn:first-child { border-top-right-radius: 0; border-bottom-right-radius: 0; }
  .tf-seg .tf-btn:last-child { border-top-left-radius: 0; border-bottom-left-radius: 0; margin-left: -1px; }
  .tf-spacer { flex: 1 1 auto; }

  .tf-selbar { display: flex; flex-wrap: wrap; align-items: center; gap: var(--cds-gap-xs) var(--cds-gap-sm); padding: var(--cds-pad-sm) var(--cds-pad-md); border: 1px solid var(--color-border-line); border-radius: var(--cds-radius); background: color-mix(in srgb, var(--color-fg) 4%, var(--color-panel)); font-size: var(--cds-font-size-caption); }
  .tf-selbar[hidden], .tf-tip[hidden] { display: none; }
  .tf-chips { display: flex; flex-wrap: wrap; align-items: center; gap: var(--cds-gap-xs); min-width: 0; }
  .tf-chip { font: inherit; font-size: var(--cds-font-size-caption); color: var(--color-fg); background: var(--color-panel); border: 1px solid var(--cds-border); border-radius: 999px; padding: 0.15rem 0.6rem; cursor: pointer; max-width: 100%; text-align: left; }
  .tf-chip:hover { background: color-mix(in srgb, var(--color-fg) 8%, var(--color-panel)); }
  .tf-chip.tf-clear { border-style: dashed; color: var(--color-fg-muted); }
  .tf-muted { color: var(--color-fg-muted); }

  .tf-kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 9.5rem), 1fr)); gap: var(--cds-gap-md); }
  .tf-kpi { font: inherit; color: inherit; text-align: left; display: flex; flex-direction: column; gap: 0.2rem; background: var(--color-panel); border: 1px solid var(--color-border-line); border-radius: var(--cds-radius); padding: var(--cds-pad-md) var(--cds-pad-lg); cursor: pointer; min-width: 0; }
  .tf-kpi:hover { border-color: var(--cds-border); background: color-mix(in srgb, var(--color-fg) 3%, var(--color-panel)); }
  .tf-kpi[aria-pressed="true"] { border-color: var(--color-fg); box-shadow: inset 0 0 0 1px var(--color-fg); }
  .tf-kpi-label { font-size: var(--cds-font-size-caption); color: var(--color-fg-muted); }
  .tf-kpi-value { font-family: var(--font-anthropic-serif); font-weight: 400; font-size: 1.9rem; line-height: 1.15; min-height: 2.2rem; }
  .tf-kpi-sub { font-size: var(--cds-font-size-caption); color: var(--color-fg-muted); min-height: 1.1rem; }

  .tf-card { background: var(--color-panel); border: 1px solid var(--color-border-line); border-radius: var(--cds-radius); padding: var(--cds-pad-lg); display: flex; flex-direction: column; gap: var(--cds-gap-sm); min-width: 0; }
  .tf-h { font-size: var(--cds-font-size-heading); font-weight: var(--cds-font-weight-medium); margin: 0; }
  .tf-note { font-size: var(--cds-font-size-caption); color: var(--color-fg-muted); margin: 0; max-width: 80ch; line-height: 1.4; }
  .tf-section { display: flex; flex-direction: column; gap: var(--cds-gap-md); }

  .tf-legend { display: flex; flex-wrap: wrap; gap: 0.25rem 0.4rem; }
  .tf-leg { font: inherit; font-size: var(--cds-font-size-caption); color: var(--cds-text-secondary); background: transparent; border: 1px solid transparent; border-radius: 999px; padding: 0.15rem 0.55rem 0.15rem 0.4rem; display: inline-flex; align-items: center; gap: 0.4rem; cursor: pointer; }
  .tf-leg:hover { background: color-mix(in srgb, var(--color-fg) 6%, transparent); }
  .tf-leg[aria-pressed="true"] { border-color: var(--color-fg); color: var(--color-fg); }
  .tf-leg b.tf-n { font-weight: var(--cds-font-weight-medium); color: var(--color-fg); }
  .tf-sw { width: 0.7rem; height: 0.7rem; border-radius: 2px; flex: none; display: inline-block; }

  .tf-plot { position: relative; min-width: 0; }
  .tf-stack { min-height: 300px; }
  .tf-chart { min-height: 280px; }
  .tf-plot svg { display: block; overflow: visible; }
  .tf-plot text { font-family: var(--font-anthropic-sans); font-size: 11px; fill: var(--color-fg-muted); }
  .tf-plot text.tf-total { fill: var(--cds-text-secondary); }
  .tf-grid-line { stroke: var(--cds-chart-grid); stroke-width: 1; }
  .tf-base-line { stroke: var(--cds-chart-axis); stroke-width: 1; }
  .tf-seg-rect { stroke: var(--color-panel); stroke-width: 2; cursor: pointer; transition: opacity var(--cds-dur-fast); }
  .tf-col-hit, .tf-hit { fill: transparent; cursor: pointer; }
  .tf-col-hit:hover { fill: color-mix(in srgb, var(--color-fg) 5%, transparent); }
  .tf-band { fill: color-mix(in srgb, var(--color-fg) 9%, transparent); }
  .tf-line { fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .tf-dot { stroke: var(--color-panel); stroke-width: 1.5; }
  .tf-rule { stroke: var(--cds-chart-reference); stroke-width: 1; }
  .tf-empty { display: flex; align-items: center; justify-content: center; gap: 0.4rem; min-height: inherit; font-size: var(--cds-font-size-caption); color: var(--color-fg-muted); text-align: center; }
  .tf-baddot { width: 0.375rem; height: 0.375rem; border-radius: 50%; background: var(--color-bad); display: inline-block; }

  .tf-tip { position: absolute; z-index: 5; pointer-events: none; background: var(--cds-surface-popover); border: 1px solid var(--cds-border); border-radius: var(--cds-radius); box-shadow: var(--cds-shadow-popover); padding: var(--cds-pad-xs) var(--cds-pad-sm); font-size: var(--cds-font-size-caption); min-width: 9rem; max-width: min(20rem, 92%); }
  .tf-tip-h { color: var(--cds-text-secondary); margin-bottom: 0.2rem; }
  .tf-tip-row { display: grid; grid-template-columns: 0.8rem auto 1fr auto; align-items: center; gap: 0.4rem; line-height: 1.5; }
  .tf-tip-row.tf-on { background: color-mix(in srgb, var(--color-fg) 7%, transparent); border-radius: 3px; }
  .tf-key { width: 0.8rem; height: 2px; border-radius: 1px; display: inline-block; }
  .tf-tip-v { font-weight: var(--cds-font-weight-medium); color: var(--color-fg); }
  .tf-tip-n { color: var(--cds-text-secondary); }
  .tf-tip-f { color: var(--color-fg-muted); margin-top: 0.25rem; }

  .tf-pills { display: flex; flex-wrap: wrap; gap: var(--cds-gap-xs); }

  .tf-scroll { overflow: auto; max-width: 100%; }
  .tf-scroll.tf-tall { max-height: 30rem; border: 1px solid var(--color-border-line); border-radius: var(--cds-radius); }
  .tf-table { border-collapse: collapse; width: 100%; font-size: var(--cds-font-size-caption); }
  .tf-table .tf-th, .tf-table .tf-td { padding: 0.4rem 0.65rem; text-align: left; white-space: nowrap; border-bottom: 1px solid var(--color-border-line); }
  .tf-table .tf-th { color: var(--color-fg-muted); font-weight: var(--cds-font-weight-medium); background: var(--color-panel); }
  .tf-table .tf-num { text-align: right; }
  .tf-tall .tf-th { position: sticky; top: 0; z-index: 1; }
  .tf-sort { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; display: inline-flex; align-items: center; gap: 0.25rem; }
  .tf-sort:hover { color: var(--color-fg); }
  .tf-arrow { font-size: 0.7em; min-width: 0.7em; }
  .tf-brow { cursor: pointer; }
  .tf-brow:hover .tf-td { background: color-mix(in srgb, var(--color-fg) 5%, transparent); }
  .tf-brow.tf-picked .tf-td { background: color-mix(in srgb, var(--color-fg) 9%, transparent); }
  .tf-brow.tf-faded .tf-td { opacity: 0.5; }
  .tf-rowbtn { font: inherit; color: var(--color-fg); background: none; border: 0; padding: 0; cursor: pointer; display: inline-flex; align-items: center; gap: 0.45rem; }
  .tf-pathcell { display: inline-flex; align-items: center; gap: 0.4rem; }
  .tf-search { min-width: min(100%, 14rem); }
  .tf-page [data-dash-source-state="refreshing"] { opacity: 0.5; transition: opacity var(--cds-dur-slow); }
</style>
</head>
<body>
<main class="tf-shell">
<div class="tf-page">
  <div class="tf-head">
    <div class="tf-headrow">
      <h1 class="tf-title">14-day trial funnel</h1>
      <span class="tf-sample" data-source="trials">Sample data</span>
    </div>
    <p class="tf-takeaway tf-skel" data-source="trials">—</p>
  </div>

  <div class="tf-row" id="filters">
    <label class="tf-field">Trials started
      <select class="tf-input tf-range" id="tf-range" aria-label="Trial start range">
        <option value="all">All dates</option>
        <option value="30">Last 30 days</option>
        <option value="90">Last 90 days</option>
        <option value="182">Last 6 months</option>
        <option value="custom">Custom</option>
      </select>
    </label>
    <label class="tf-field">From <input class="tf-input tf-start" id="tf-start" type="date" min="2000-01-01" max="2099-12-31" aria-label="Trial start from"></label>
    <label class="tf-field">To <input class="tf-input tf-end" id="tf-end" type="date" min="2000-01-01" max="2099-12-31" aria-label="Trial start to"></label>
    <span class="tf-field">Group by
      <span class="tf-seg" role="group" aria-label="Time grain">
        <button class="tf-btn tf-grain" type="button" data-grain="week">Week</button>
        <button class="tf-btn tf-grain" type="button" data-grain="month">Month</button>
      </span>
    </span>
    <span class="tf-spacer"></span>
    <button class="tf-btn tf-reset" type="button">Reset</button>
  </div>

  <div class="tf-selbar" hidden>
    <span class="tf-muted">Rows filtered by</span>
    <span class="tf-chips tf-chips-top"></span>
    <span class="tf-spacer"></span>
    <button class="tf-btn tf-jump" type="button">—</button>
  </div>

  <div class="tf-kpis" id="headline">
    <button class="tf-kpi" type="button" data-stage="all" data-source="trials" id="kpi-trials"><span class="tf-kpi-label">Trials started</span><span class="tf-kpi-value tf-skel">—</span><span class="tf-kpi-sub"></span></button>
    <button class="tf-kpi" type="button" data-stage="paid" data-source="trials" id="kpi-paid"><span class="tf-kpi-label">Trial → paid</span><span class="tf-kpi-value tf-skel">—</span><span class="tf-kpi-sub"></span></button>
    <button class="tf-kpi" type="button" data-stage="free" data-source="trials" id="kpi-free"><span class="tf-kpi-label">Trial → freemium</span><span class="tf-kpi-value tf-skel">—</span><span class="tf-kpi-sub"></span></button>
    <button class="tf-kpi" type="button" data-stage="pql" data-source="trials" id="kpi-pql"><span class="tf-kpi-label">PQLs</span><span class="tf-kpi-value tf-skel">—</span><span class="tf-kpi-sub"></span></button>
    <button class="tf-kpi" type="button" data-stage="arr" data-source="trials" id="kpi-arr"><span class="tf-kpi-label">ARR from trials</span><span class="tf-kpi-value tf-skel">—</span><span class="tf-kpi-sub"></span></button>
  </div>

  <div class="tf-card" id="paths">
    <h2 class="tf-h">Trials by path</h2>
    <p class="tf-note tf-stack-note">Each bar is the trials that started in that period, split by where they went. Click a segment, a bar or a path to filter the rows below.</p>
    <div class="tf-legend" data-source="trials"></div>
    <div class="tf-plot" data-source="trials"><div class="tf-stack tf-skel"></div><div class="tf-tip" hidden></div></div>
  </div>

  <div class="tf-section" id="over-time">
    <div class="tf-row">
      <h2 class="tf-h">Metrics over time</h2>
      <span class="tf-spacer"></span>
      <label class="tf-field">Date
        <select class="tf-input tf-basis" id="tf-basis" aria-label="Date used for the time axis">
          <option value="trial_start">Trial start date</option>
          <option value="freemium_start">Freemium start date</option>
          <option value="first_active_date">First active date</option>
        </select>
      </label>
      <label class="tf-field">Break down by
        <select class="tf-input tf-dim" id="tf-dim" aria-label="Break down by">
          <option value="sales_theater">Sales theater</option>
          <option value="segment">Segment</option>
          <option value="channel">Channel</option>
          <option value="plan">Plan</option>
          <option value="none">No breakdown</option>
        </select>
      </label>
    </div>
    <p class="tf-note tf-trend-note">—</p>
    <div class="tf-card" id="breakdown">
      <div class="tf-scroll" data-source="trials">
        <table class="tf-table tf-btable"><thead></thead><tbody></tbody></table>
      </div>
    </div>
    <div class="tf-card" id="trend">
      <div class="tf-row">
        <h3 class="tf-h tf-trend-title">—</h3>
        <span class="tf-spacer"></span>
        <span class="tf-pills" role="group" aria-label="Metric">
          <button class="tf-btn tf-metric" type="button" data-metric="trials">Trials</button>
          <button class="tf-btn tf-metric" type="button" data-metric="paid_rate">Trial → paid</button>
          <button class="tf-btn tf-metric" type="button" data-metric="free_rate">Trial → freemium</button>
          <button class="tf-btn tf-metric" type="button" data-metric="pqls">PQLs</button>
          <button class="tf-btn tf-metric" type="button" data-metric="arr">ARR</button>
        </span>
      </div>
      <div class="tf-plot" data-source="trials"><div class="tf-chart tf-skel"></div><div class="tf-tip" hidden></div></div>
    </div>
  </div>

  <div class="tf-card" id="trial-rows">
    <div class="tf-row">
      <h2 class="tf-h">Trial detail</h2>
      <span class="tf-muted tf-count" data-source="trials">—</span>
      <span class="tf-spacer"></span>
      <input class="tf-input tf-search" id="tf-search" type="search" placeholder="Search account, ID, path…" aria-label="Search trials">
    </div>
    <div class="tf-chips tf-chips-table"></div>
    <div class="tf-scroll tf-tall">
      <table class="tf-table tf-dtable" data-source="trials" data-row-key="trial_id"><thead></thead><tbody></tbody></table>
    </div>
  </div>
</div>
</main>

<script>
  // Stand-in for the dashboard runtime this page was built on: loads the rows, holds the filter state, redraws on change.
  (() => {
    const rows = d3.csvParse(document.getElementById('tf-data').textContent.trim());
    let params = {};
    const fns = [];
    const fire = () => fns.forEach((f) => f());
    window.dash = {
      colors: [1, 2, 3, 4, 5, 6, 7, 8].map((i) => `var(--c${i})`),
      data: () => ({ status: 'ok', data: rows }),
      onData: (f) => { fns.push(f); f(); },
      params: () => ({ ...params }),
      setParams: (o) => { Object.assign(params, o); fire(); },
      resetParams: () => { params = {}; fire(); },
    };
    let t; window.addEventListener('resize', () => { clearTimeout(t); t = setTimeout(fire, 120); });
  })();
</script>
<script>
  const root = document.querySelector('.tf-page');
  const $ = (s) => root.querySelector(s);
  const $$ = (s) => [...root.querySelectorAll(s)];
  const SRC = 'trials';
  const DEF = { start: null, end: null, grain: 'month', basis: 'trial_start', dim: 'sales_theater', metric: 'trials', sel_stage: null, sel_path: null, sel_period: null, sel_dim: null };
  const P = () => { const p = dash.params(); const o = {}; for (const k in DEF) o[k] = p[k] ?? DEF[k]; return o; };

  const C = dash.colors;
  const PATHS = [
    { key: 'Trial → Paid', color: C[0] },
    { key: 'Trial → PQL → Paid', color: C[1] },
    { key: 'Trial → Free → Paid', color: C[2] },
    { key: 'Trial → Free → PQL → Paid', color: C[3] },
    { key: 'Trial → Free', label: 'Trial → Free (not paid yet)', color: C[4] },
    { key: 'In trial', color: C[5] },
    { key: 'Trial → Churned', color: 'var(--cds-chart-muted)' },
  ];
  const pathColor = (k) => (PATHS.find((x) => x.key === k) || {}).color || 'var(--cds-chart-muted)';
  const pathLabel = (k) => { const x = PATHS.find((y) => y.key === k); return x ? x.label || x.key : k; };
  const BASIS = { trial_start: 'Trial start', freemium_start: 'Freemium start', first_active_date: 'First active' };
  const DIMS = { sales_theater: 'Sales theater', segment: 'Segment', channel: 'Channel', plan: 'Plan', none: 'All trials' };
  const STAGES = { paid: 'Converted to paid', free: 'Moved to freemium', pql: 'Became a PQL' };
  const MIN_RATE_N = 5;
  const ROW_CAP = 300;

  const fInt = d3.format(',');
  const fPct = d3.format('.1%');
  const fPct0 = d3.format('.0%');
  const fUsd = d3.format('$,');
  const compactUsd = new Intl.NumberFormat('en', { style: 'currency', currency: 'USD', notation: 'compact', maximumFractionDigits: 1 });
  const fMoney = (v) => (v >= 10000 ? compactUsd.format(v) : fUsd(Math.round(v)));
  const toDate = (s) => new Date(s + 'T00:00:00Z');
  const isoDay = d3.utcFormat('%Y-%m-%d');
  const fDay = d3.utcFormat('%b %-d');
  const fDayY = d3.utcFormat('%b %-d, %Y');
  const fMon = d3.utcFormat('%b');
  const fMonY = d3.utcFormat('%b %Y');
  const tickLabel = (k, grain) => (grain === 'month' ? fMon(toDate(k)) : fDay(toDate(k)));
  const periodLabel = (k, grain) => (grain === 'month' ? fMonY(toDate(k)) : 'Week of ' + fDayY(toDate(k)));
  const interval = (grain) => (grain === 'month' ? d3.utcMonth : d3.utcMonday);
  const rangeKeys = (k0, k1, grain) => interval(grain).range(toDate(k0), d3.utcDay.offset(toDate(k1), 1)).map(isoDay);

  const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
  const swatch = (color, cls) => { const s = el('span', cls || 'tf-sw'); s.style.background = color; return s; };

  // ---------- data ----------
  const cache = { src: null };
  const day = (v) => (v == null ? '' : String(v).slice(0, 10));
  const bucket = (s) => (s ? { month: s.slice(0, 7) + '-01', week: isoDay(d3.utcMonday.floor(toDate(s))) } : null);
  function prep(data) {
    if (cache.src === data) return cache;
    const rows = data.map((r) => {
      const o = {
        trial_id: String(r.trial_id), account: String(r.account ?? ''), sales_theater: String(r.sales_theater ?? ''), segment: String(r.segment ?? ''),
        channel: String(r.channel ?? ''), plan: String(r.plan ?? ''), seats: Number(r.seats) || 0, status: String(r.status ?? ''), path: String(r.path ?? ''),
        trial_start: day(r.trial_start), first_active_date: day(r.first_active_date), freemium_start: day(r.freemium_start), pql_date: day(r.pql_date), paid_date: day(r.paid_date),
        arr: Number(r.arr) || 0,
      };
      o.paid = !!o.paid_date; o.free = !!o.freemium_start; o.pql = !!o.pql_date;
      o.b = { trial_start: bucket(o.trial_start), freemium_start: bucket(o.freemium_start), first_active_date: bucket(o.first_active_date) };
      o.text = [o.trial_id, o.account, o.sales_theater, o.segment, o.channel, o.plan, o.status, o.path].join(' ').toLowerCase();
      return o;
    }).filter((o) => o.trial_start);
    const dimVals = { none: ['All trials'] };
    for (const d of ['sales_theater', 'segment', 'channel', 'plan']) dimVals[d] = d3.rollups(rows, (v) => v.length, (r) => r[d]).sort((a, b) => b[1] - a[1]).map((x) => x[0]);
    const ext = d3.extent(rows, (r) => r.trial_start);
    Object.assign(cache, { src: data, rows, dimVals, min: ext[0] || '', max: ext[1] || '' });
    return cache;
  }
  const agg = (rows) => { const a = { n: 0, paid: 0, free: 0, pql: 0, arr: 0 }; for (const r of rows) add(a, r); return a; };
  const add = (a, r) => { a.n++; if (r.paid) { a.paid++; a.arr += r.arr; } if (r.free) a.free++; if (r.pql) a.pql++; };
  const dimOf = (r, dim) => (dim === 'none' ? 'All trials' : r[dim]);
  const split2 = (s) => { const i = s.indexOf('|'); return [s.slice(0, i), s.slice(i + 1)]; };
  const parsePeriod = (s) => { if (!s) return null; const [basis, rest] = split2(s); const [grain, key] = split2(rest); return { basis, grain, key }; };
  function matches(r, p) {
    if (p.sel_stage === 'paid' && !r.paid) return false;
    if (p.sel_stage === 'free' && !r.free) return false;
    if (p.sel_stage === 'pql' && !r.pql) return false;
    if (p.sel_path && r.path !== p.sel_path) return false;
    const per = parsePeriod(p.sel_period);
    if (per && (!r.b[per.basis] || r.b[per.basis][per.grain] !== per.key)) return false;
    if (p.sel_dim) { const [col, val] = split2(p.sel_dim); if (r[col] !== val) return false; }
    return true;
  }
  const toggle = (obj) => {
    const p = P();
    const same = Object.keys(obj).every((k) => p[k] === obj[k]);
    dash.setParams(same ? Object.fromEntries(Object.keys(obj).map((k) => [k, null])) : obj);
  };

  // ---------- tooltip ----------
  function showTip(plot, ev, head, rows, foot) {
    const tip = plot.querySelector('.tf-tip');
    tip.replaceChildren(el('div', 'tf-tip-h', head));
    for (const r of rows) {
      const row = el('div', 'tf-tip-row' + (r.on ? ' tf-on' : ''));
      const key = el('span', 'tf-key'); key.style.background = r.color;
      row.append(key, el('span', 'tf-tip-v', r.value), el('span', 'tf-tip-n', r.name), el('span', 'tf-tip-n', r.extra || ''));
      tip.append(row);
    }
    if (foot) tip.append(el('div', 'tf-tip-f', foot));
    tip.hidden = false;
    const box = plot.getBoundingClientRect();
    let x = ev.clientX - box.left + 14;
    let y = ev.clientY - box.top + 14;
    if (x + tip.offsetWidth > box.width) x = ev.clientX - box.left - tip.offsetWidth - 14;
    if (y + tip.offsetHeight > box.height) y = box.height - tip.offsetHeight;
    tip.style.left = Math.max(0, x) + 'px';
    tip.style.top = Math.max(0, y) + 'px';
  }
  const hideTip = (plot) => { plot.querySelector('.tf-tip').hidden = true; };

  // ---------- shared axis helpers ----------
  function yAxis(svg, y, ticks, fmt, W, mr) {
    const g = svg.append('g');
    const t = g.selectAll('text').data(ticks).join('text').attr('text-anchor', 'end').attr('dy', '0.32em').text(fmt);
    let w = 0; t.each(function () { w = Math.max(w, this.getComputedTextLength()); });
    const ml = Math.ceil(w) + 10;
    t.attr('x', ml - 8).attr('y', (d) => y(d));
    g.selectAll('line').data(ticks).join('line').attr('class', (d) => (d === 0 ? 'tf-base-line' : 'tf-grid-line')).attr('x1', ml).attr('x2', W - mr).attr('y1', (d) => y(d)).attr('y2', (d) => y(d));
    return ml;
  }
  function xLabels(svg, keys, pos, step, yPos, grain) {
    const t = svg.append('g').selectAll('text').data(keys).join('text').attr('text-anchor', 'middle').attr('x', (d) => pos(d)).attr('y', yPos).text((d) => tickLabel(d, grain));
    let w = 0; t.each(function () { w = Math.max(w, this.getComputedTextLength()); });
    const every = Math.max(1, Math.ceil((w + 12) / Math.max(step, 1)));
    t.style('display', (d, i) => ((keys.length - 1 - i) % every === 0 ? null : 'none'));
  }
  const emptyBox = (box, msg, bad) => { const e = el('div', 'tf-empty'); if (bad) e.append(el('span', 'tf-baddot')); e.append(el('span', null, msg)); box.replaceChildren(e); };

  // ---------- stacked path chart ----------
  function drawStack(scope, p) {

    const grain = p.grain;
    const ext = d3.extent(scope, (r) => r.b.trial_start[grain]);
    const keys = rangeKeys(ext[0], ext[1], grain);
    const by = new Map(keys.map((k) => [k, Object.assign({ key: k, total: 0 }, Object.fromEntries(PATHS.map((x) => [x.key, 0])))]));
    for (const r of scope) { const c = by.get(r.b.trial_start[grain]); if (c && r.path in c) { c[r.path]++; c.total++; } }
    const table = keys.map((k) => by.get(k));
    const series = d3.stack().keys(PATHS.map((x) => x.key))(table);
    const mt = 18, mb = 24, mr = 6;
    const y = d3.scaleLinear([0, d3.max(table, (d) => d.total) || 1], [H - mb, mt]).nice(4);
    const svg = d3.select(box).append('svg').attr('width', '100%').attr('viewBox', `0 0 ${W} ${H}`).attr('role', 'img')
      .attr('aria-label', `Trials started per ${grain}, stacked by path`);
    const ml = yAxis(svg, y, y.ticks(4), fInt, W, mr);
    const x = d3.scaleBand(keys, [ml, W - mr]).paddingInner(0.28).paddingOuter(0.14);
    const bw = Math.min(x.bandwidth(), 44);
    const bx = (k) => x(k) + (x.bandwidth() - bw) / 2;
    const per = parsePeriod(p.sel_period);
    const selKey = per && per.basis === 'trial_start' && per.grain === grain ? per.key : null;
    const tipFor = (ev, d, onPath) => showTip(plot, ev, `Started ${periodLabel(d.key, grain)} · ${fInt(d.total)} trials`,
      PATHS.slice().reverse().filter((x2) => d[x2.key] > 0).map((x2) => ({ color: x2.color, value: fInt(d[x2.key]), name: pathLabel(x2.key), extra: fPct0(d[x2.key] / d.total), on: x2.key === onPath })),
      'Click to filter the rows');

    svg.append('g').selectAll('rect').data(table).join('rect').attr('class', 'tf-col-hit')
      .attr('x', (d) => x(d.key) - x.step() * x.paddingInner() / 2).attr('width', x.step()).attr('y', mt).attr('height', H - mb - mt)
      .on('pointermove', (ev, d) => tipFor(ev, d, null)).on('pointerleave', () => hideTip(plot))
      .on('click', (ev, d) => toggle({ sel_period: `trial_start|${grain}|${d.key}` }));

    svg.append('g').selectAll('g').data(series).join('g').style('fill', (s) => pathColor(s.key))
      .selectAll('rect').data((s) => s.map((d) => ({ path: s.key, row: d.data, y0: d[0], y1: d[1] })).filter((d) => d.y1 > d.y0)).join('rect')
      .attr('class', 'tf-seg-rect').attr('rx', 2)
      .attr('x', (d) => bx(d.row.key)).attr('width', bw).attr('y', (d) => y(d.y1)).attr('height', (d) => Math.max(0, y(d.y0) - y(d.y1)))
      .style('opacity', (d) => ((p.sel_path && d.path !== p.sel_path) || (selKey && d.row.key !== selKey) ? 0.3 : 1))
      .on('pointermove', (ev, d) => tipFor(ev, d.row, d.path)).on('pointerleave', () => hideTip(plot))
      .on('click', (ev, d) => toggle({ sel_path: d.path, sel_period: `trial_start|${grain}|${d.row.key}` }));

    if (x.step() >= 34) {
      svg.append('g').selectAll('text').data(table.filter((d) => d.total > 0)).join('text').attr('class', 'tf-total').attr('text-anchor', 'middle')
        .attr('x', (d) => x(d.key) + x.bandwidth() / 2).attr('y', (d) => y(d.total) - 5).text((d) => fInt(d.total)).style('pointer-events', 'none');
    }
    xLabels(svg, keys, (k) => x(k) + x.bandwidth() / 2, x.step(), H - 6, grain);
  }

  function drawLegend(scope, p) {
    const counts = d3.rollup(scope, (v) => v.length, (r) => r.path);
    const box = $('.tf-legend');
    box.replaceChildren(...PATHS.map((x) => {
      const b = el('button', 'tf-leg'); b.type = 'button';
      b.setAttribute('aria-pressed', String(p.sel_path === x.key));
      const n = el('b', 'tf-n', fInt(counts.get(x.key) || 0));
      b.append(swatch(x.color), el('span', null, pathLabel(x.key)), n);
      b.addEventListener('click', () => toggle({ sel_path: x.key }));
      return b;
    }));
  }

  // ---------- trends ----------
  const METRICS = [
    { id: 'trials', title: 'Trials', name: 'trials', val: (a) => a.n, fmt: fInt, tick: fInt },
    { id: 'pqls', title: 'PQLs', name: 'PQLs', val: (a) => a.pql, fmt: fInt, tick: fInt },
    { id: 'arr', title: 'ARR', name: 'ARR', val: (a) => a.arr, fmt: fMoney, tick: (v) => compactUsd.format(v) },
    { id: 'paid_rate', title: 'Trial → paid rate', name: 'trial → paid', val: (a) => (a.n >= MIN_RATE_N ? a.paid / a.n : null), fmt: fPct, tick: fPct0, rate: true },
    { id: 'free_rate', title: 'Trial → freemium rate', name: 'trial → freemium', val: (a) => (a.n >= MIN_RATE_N ? a.free / a.n : null), fmt: fPct, tick: fPct0, rate: true },
  ];
  function drawTrends(scope, p) {
    const { basis, grain, dim } = p;
    const vals = cache.dimVals[dim] || ['All trials'];
    const dated = scope.filter((r) => r.b[basis]);
    const ext = d3.extent(dated, (r) => r.b[basis][grain]);
    const keys = dated.length ? rangeKeys(ext[0], ext[1], grain) : [];
    const cells = new Map();
    for (const r of dated) {
      const id = r.b[basis][grain] + '|' + dimOf(r, dim);
      let a = cells.get(id); if (!a) cells.set(id, (a = { n: 0, paid: 0, free: 0, pql: 0, arr: 0 }));
      add(a, r);
    }
    const zero = { n: 0, paid: 0, free: 0, pql: 0, arr: 0 };
    const cell = (k, v) => cells.get(k + '|' + v) || zero;
    const m = METRICS.find((x) => x.id === p.metric) || METRICS[0];
    $('.tf-trend-title').textContent = `${m.title} by ${BASIS[basis].toLowerCase()} ${grain}` + (dim === 'none' ? '' : `, by ${DIMS[dim].toLowerCase()}`);
    for (const b of $$('.tf-metric')) b.setAttribute('aria-pressed', String(b.dataset.metric === m.id));
    drawTrend(m, keys, vals, cell, p);
    $('.tf-trend-note').textContent = `Each point holds the trials whose ${BASIS[basis].toLowerCase()} date falls in that ${grain}` +
      (basis === 'trial_start' ? '.' : `; trials without one are left out (${fInt(scope.length - dated.length)} of ${fInt(scope.length)}).`) +
      ` Rates need at least ${MIN_RATE_N} trials in a point, and the latest periods are still converting. Click a point or a row to filter the trial rows.`;
  }
  function drawTrend(m, keys, vals, cell, p) {
    const box = $('.tf-chart');
    const plot = box.parentElement;
    box.replaceChildren(); hideTip(plot);
    const W = box.clientWidth, H = 280;
    if (!W) return;
    if (!keys.length) { emptyBox(box, `No trials in this range have a ${BASIS[p.basis].toLowerCase()} date.`); return; }
    const { basis, grain, dim } = p;
    const series = vals.map((v, i) => ({ name: v, color: C[i % C.length], pts: keys.map((k) => ({ k, v: m.val(cell(k, v)), n: cell(k, v).n })) }));
    const max = d3.max(series, (s) => d3.max(s.pts, (d) => d.v)) || (m.rate ? 0.1 : 1);
    const mt = 10, mb = 24, mr = 18;
    const y = d3.scaleLinear([0, max], [H - mb, mt]).nice(4);
    const svg = d3.select(box).append('svg').attr('width', '100%').attr('viewBox', `0 0 ${W} ${H}`).attr('role', 'img')
      .attr('aria-label', `${m.name} by ${BASIS[basis].toLowerCase()} ${grain}` + (dim === 'none' ? '' : `, by ${DIMS[dim].toLowerCase()}`));
    const ml = yAxis(svg, y, y.ticks(4), m.tick, W, mr);
    const x = d3.scalePoint(keys, [ml, W - mr]).padding(0.5);
    const step = keys.length > 1 ? x.step() : W - mr - ml;
    const per = parsePeriod(p.sel_period);
    const selKey = per && per.basis === basis && per.grain === grain && keys.includes(per.key) ? per.key : null;
    const selDim = p.sel_dim && dim !== 'none' && split2(p.sel_dim)[0] === dim ? split2(p.sel_dim)[1] : null;
    if (selKey) svg.append('rect').attr('class', 'tf-band').attr('x', x(selKey) - step / 2).attr('width', step).attr('y', mt).attr('height', H - mb - mt);
    const line = d3.line().defined((d) => d.v != null).x((d) => x(d.k)).y((d) => y(d.v));
    const gs = svg.append('g').selectAll('g').data(series).join('g').style('opacity', (s) => (selDim && s.name !== selDim ? 0.3 : 1));
    gs.append('path').attr('class', 'tf-line').attr('d', (s) => line(s.pts)).style('stroke', (s) => s.color);
    if (keys.length <= 20) {
      gs.selectAll('circle').data((s) => s.pts.filter((d) => d.v != null).map((d) => ({ ...d, color: s.color }))).join('circle')
        .attr('class', 'tf-dot').attr('r', 3).attr('cx', (d) => x(d.k)).attr('cy', (d) => y(d.v)).style('fill', (d) => d.color);
    }
    xLabels(svg, keys, (k) => x(k), step, H - 6, grain);
    const hover = svg.append('g').style('pointer-events', 'none');
    const at = (ev) => {
      const [mx, my] = d3.pointer(ev, svg.node());
      const i = Math.max(0, Math.min(keys.length - 1, Math.round((mx - x(keys[0])) / Math.max(step, 1))));
      let near = null, best = 14;
      for (const s of series) { const d = s.pts[i]; if (d.v == null) continue; const dy = Math.abs(y(d.v) - my); if (dy < best) { best = dy; near = s.name; } }
      return { i, k: keys[i], near: dim === 'none' ? null : near };
    };
    svg.append('rect').attr('class', 'tf-hit').attr('x', ml).attr('width', Math.max(0, W - mr - ml)).attr('y', mt).attr('height', H - mb - mt)
      .on('pointermove', (ev) => {
        const h = at(ev);
        hover.selectAll('*').remove();
        hover.append('line').attr('class', 'tf-rule').attr('x1', x(h.k)).attr('x2', x(h.k)).attr('y1', mt).attr('y2', H - mb);
        const rows = series.map((s) => ({ s, d: s.pts[h.i] })).filter((r) => r.d.v != null).sort((a, b) => b.d.v - a.d.v);
        for (const r of rows) hover.append('circle').attr('class', 'tf-dot').attr('r', r.s.name === h.near ? 5 : 4).attr('cx', x(h.k)).attr('cy', y(r.d.v)).style('fill', r.s.color);
        showTip(plot, ev, `${BASIS[basis]} · ${periodLabel(h.k, grain)}`,
          rows.map((r) => ({ color: r.s.color, value: m.fmt(r.d.v), name: r.s.name, extra: m.rate ? `of ${fInt(r.d.n)}` : '', on: r.s.name === h.near })),
          rows.length ? 'Click to filter the rows' : 'Too few trials for a rate');
      })
      .on('pointerleave', () => { hover.selectAll('*').remove(); hideTip(plot); })
      .on('click', (ev) => {
        const h = at(ev);
        const sel = { sel_period: `${basis}|${grain}|${h.k}` };
        if (h.near) sel.sel_dim = `${dim}|${h.near}`;
        toggle(sel);
      });
  }

  // ---------- breakdown table ----------
  function drawBreakdown(scope, p) {
    const dim = p.dim;
    const vals = cache.dimVals[dim] || ['All trials'];
    const groups = d3.group(scope, (r) => dimOf(r, dim));
    const head = el('tr');
    for (const [label, num] of [[DIMS[dim], 0], ['Trials', 1], ['Trial → paid', 1], ['Trial → freemium', 1], ['PQLs', 1], ['ARR', 1]]) head.append(el('th', 'tf-th' + (num ? ' tf-num' : ''), label));
    $('.tf-btable thead').replaceChildren(head);
    const sel = p.sel_dim ? split2(p.sel_dim) : null;
    const rows = vals.map((v, i) => ({ v, i, a: agg(groups.get(v) || []) })).sort((a, b) => b.a.n - a.a.n);
    $('.tf-btable tbody').replaceChildren(...rows.map(({ v, i, a }) => {
      const picked = sel && sel[0] === dim && sel[1] === v;
      const tr = el('tr', dim === 'none' ? '' : 'tf-brow' + (picked ? ' tf-picked' : sel && sel[0] === dim ? ' tf-faded' : ''));
      const first = el('td', 'tf-td');
      if (dim === 'none') { const s = el('span', 'tf-pathcell'); s.append(swatch(C[0]), el('span', null, v)); first.append(s); }
      else {
        const b = el('button', 'tf-rowbtn'); b.type = 'button'; b.setAttribute('aria-pressed', String(!!picked));
        b.append(swatch(C[i % C.length]), el('span', null, v));
        first.append(b);
        tr.addEventListener('click', () => toggle({ sel_dim: `${dim}|${v}` }));
      }
      tr.append(first, el('td', 'tf-td tf-num', fInt(a.n)), el('td', 'tf-td tf-num', a.n ? fPct(a.paid / a.n) : '—'), el('td', 'tf-td tf-num', a.n ? fPct(a.free / a.n) : '—'),
        el('td', 'tf-td tf-num', fInt(a.pql)), el('td', 'tf-td tf-num', a.n ? fMoney(a.arr) : '—'));
      return tr;
    }));
  }

  // ---------- trial rows ----------
  const COLS = [
    ['trial_id', 'Trial', 'text'], ['account', 'Account', 'text'], ['sales_theater', 'Theater', 'text'], ['segment', 'Segment', 'text'], ['channel', 'Channel', 'text'],
    ['plan', 'Plan', 'text'], ['seats', 'Seats', 'num'], ['trial_start', 'Trial start', 'date'], ['first_active_date', 'First active', 'date'], ['freemium_start', 'Freemium start', 'date'],
    ['pql_date', 'PQL', 'date'], ['paid_date', 'Paid', 'date'], ['path', 'Path', 'path'], ['status', 'Status', 'text'], ['arr', 'ARR', 'money'],
  ];
  const view = { sort: 'trial_start', dir: -1, q: '', rows: [], scopeN: 0 };
  {
    const tr = el('tr');
    for (const [field, label, kind] of COLS) {
      const th = el('th', 'tf-th' + (kind === 'num' || kind === 'money' ? ' tf-num' : ''));
      th.dataset.field = field;
      const b = el('button', 'tf-sort'); b.type = 'button'; b.dataset.col = field;
      b.append(el('span', null, label), el('span', 'tf-arrow', ''));
      th.append(b); tr.append(th);
    }
    $('.tf-dtable thead').append(tr);
  }
  function drawRows() {
    const q = view.q.trim().toLowerCase();
    let rows = q ? view.rows.filter((r) => r.text.includes(q)) : view.rows.slice();
    const col = view.sort, dir = view.dir;
    const numeric = col === 'seats' || col === 'arr';
    rows.sort((a, b) => {
      const va = a[col], vb = b[col];
      if (!numeric) { if (!va && vb) return 1; if (va && !vb) return -1; }
      return (numeric ? va - vb : va < vb ? -1 : va > vb ? 1 : 0) * dir || (a.trial_id < b.trial_id ? -1 : 1);
    });
    for (const th of $$('.tf-dtable .tf-th')) {
      const on = th.dataset.field === col;
      if (on) th.setAttribute('aria-sort', dir > 0 ? 'ascending' : 'descending'); else th.removeAttribute('aria-sort');
      th.querySelector('.tf-arrow').textContent = on ? (dir > 0 ? '▲' : '▼') : '';
    }
    const shown = rows.slice(0, ROW_CAP);
    $('.tf-count').textContent = `${fInt(rows.length)} of ${fInt(view.scopeN)} trials` + (rows.length > ROW_CAP ? ` · showing the first ${ROW_CAP}` : '');
    const body = $('.tf-dtable tbody');
    if (!shown.length) {
      const tr = el('tr'); const td = el('td', 'tf-td tf-muted', 'No trials match. Remove a filter above or clear the search.'); td.colSpan = COLS.length; tr.append(td);
      body.replaceChildren(tr); return;
    }
    body.replaceChildren(...shown.map((r) => {
      const tr = el('tr'); tr.dataset.key = r.trial_id;
      for (const [field, , kind] of COLS) {
        const v = r[field];
        const td = el('td', 'tf-td' + (kind === 'num' || kind === 'money' ? ' tf-num' : ''));
        if (kind === 'path') { const s = el('span', 'tf-pathcell'); s.append(swatch(pathColor(v)), el('span', null, v)); td.append(s); }
        else td.textContent = kind === 'date' ? (v ? fDay(toDate(v)) : '—') : kind === 'money' ? (v ? fUsd(v) : '—') : kind === 'num' ? fInt(v) : v;
        tr.append(td);
      }
      return tr;
    }));
  }

  // ---------- chips ----------
  function chipList(p) {
    const out = [];
    if (p.sel_stage && STAGES[p.sel_stage]) out.push({ text: STAGES[p.sel_stage], clear: { sel_stage: null } });
    if (p.sel_path) out.push({ text: 'Path: ' + pathLabel(p.sel_path), clear: { sel_path: null } });
    const per = parsePeriod(p.sel_period);
    if (per) out.push({ text: `${BASIS[per.basis] || per.basis}: ${periodLabel(per.key, per.grain)}`, clear: { sel_period: null } });
    if (p.sel_dim) { const [col, val] = split2(p.sel_dim); out.push({ text: `${DIMS[col] || col}: ${val}`, clear: { sel_dim: null } }); }
    return out;
  }
  function drawChips(p, n) {
    const chips = chipList(p);
    for (const box of [$('.tf-chips-top'), $('.tf-chips-table')]) {
      const nodes = chips.map((c) => { const b = el('button', 'tf-chip', c.text + '  ×'); b.type = 'button'; b.setAttribute('aria-label', 'Remove filter: ' + c.text); b.addEventListener('click', () => dash.setParams(c.clear)); return b; });
      if (chips.length > 1) { const b = el('button', 'tf-chip tf-clear', 'Clear all'); b.type = 'button'; b.addEventListener('click', clearSel); nodes.push(b); }
      box.replaceChildren(...nodes);
    }
    $('.tf-selbar').hidden = !chips.length;
    $('.tf-jump').textContent = `${fInt(n)} matching ${n === 1 ? 'trial' : 'trials'} ↓`;
  }
  const clearSel = () => dash.setParams({ sel_stage: null, sel_path: null, sel_period: null, sel_dim: null });

  // ---------- controls ----------
  const startIn = $('.tf-start'), endIn = $('.tf-end'), rangeSel = $('.tf-range');
  const presetStart = (days) => (cache.max ? isoDay(d3.utcDay.offset(toDate(cache.max), -(days - 1))) : null);
  const showDates = () => { const p = P(); startIn.value = p.start || cache.min || ''; endIn.value = p.end || cache.max || ''; };
  startIn.addEventListener('change', () => { if (startIn.value && startIn.validity.valid) dash.setParams({ start: startIn.value === cache.min ? null : startIn.value }); });
  endIn.addEventListener('change', () => { if (endIn.value && endIn.validity.valid) dash.setParams({ end: endIn.value === cache.max ? null : endIn.value }); });
  startIn.addEventListener('blur', showDates);
  endIn.addEventListener('blur', showDates);
  rangeSel.addEventListener('change', () => {
    if (rangeSel.value === 'all') dash.setParams({ start: null, end: null });
    else if (rangeSel.value !== 'custom') dash.setParams({ start: presetStart(Number(rangeSel.value)), end: null });
  });
  for (const b of $$('.tf-grain')) b.addEventListener('click', () => dash.setParams({ grain: b.dataset.grain }));
  $('.tf-basis').addEventListener('change', (e) => dash.setParams({ basis: e.target.value }));
  $('.tf-dim').addEventListener('change', (e) => dash.setParams({ dim: e.target.value }));
  for (const b of $$('.tf-metric')) b.addEventListener('click', () => dash.setParams({ metric: b.dataset.metric }));
  $('.tf-reset').addEventListener('click', () => { view.q = ''; $('.tf-search').value = ''; view.sort = 'trial_start'; view.dir = -1; dash.resetParams(); });
  $('.tf-jump').addEventListener('click', () => document.getElementById('trial-rows').scrollIntoView({ behavior: 'smooth', block: 'start' }));
  $('.tf-search').addEventListener('input', (e) => { view.q = e.target.value; drawRows(); });
  $('.tf-dtable thead').addEventListener('click', (e) => {
    const b = e.target.closest('.tf-sort'); if (!b) return;
    if (view.sort === b.dataset.col) view.dir = -view.dir; else { view.sort = b.dataset.col; view.dir = b.dataset.col === 'arr' || b.dataset.col === 'seats' ? -1 : 1; }
    drawRows();
  });
  for (const k of $$('.tf-kpi')) k.addEventListener('click', () => {
    const s = k.dataset.stage;
    if (s === 'all') { dash.setParams({ sel_stage: null }); return; }
    if (s === 'arr') { view.sort = 'arr'; view.dir = -1; if (P().sel_stage === 'paid') drawRows(); else dash.setParams({ sel_stage: 'paid' }); return; }
    toggle({ sel_stage: s });
  });

  // ---------- render ----------
  function setKpi(id, value, sub) { const k = document.getElementById(id); k.querySelector('.tf-kpi-value').textContent = value; k.querySelector('.tf-kpi-sub').textContent = sub; }
  function placeholder(status) {
    const bad = status === 'error';
    for (const id of ['kpi-trials', 'kpi-paid', 'kpi-free', 'kpi-pql', 'kpi-arr']) setKpi(id, '—', '');
    $('.tf-takeaway').textContent = '—';
    $('.tf-count').textContent = '—';
    $('.tf-trend-title').textContent = '—';
    $('.tf-legend').replaceChildren();
    $('.tf-btable thead').replaceChildren(); $('.tf-btable tbody').replaceChildren();
    $('.tf-dtable tbody').replaceChildren();
    $('.tf-selbar').hidden = true;
    for (const box of $$('.tf-stack, .tf-chart')) { if (bad) emptyBox(box, 'Failed to load', true); else box.replaceChildren(); }
  }
  dash.onData(() => {
    const g = dash.data(SRC);
    for (const e of $$('.tf-skel')) e.classList.toggle('dash-skeleton', g.status === 'loading');
    if (g.status !== 'ok' || !Array.isArray(g.data)) { placeholder(g.status); return; }
    prep(g.data);
    const p = P();
    const scope = cache.rows.filter((r) => (!p.start || r.trial_start >= p.start) && (!p.end || r.trial_start <= p.end));
    const a = agg(scope);

    // controls
    startIn.min = endIn.min = cache.min; startIn.max = endIn.max = cache.max;
    if (document.activeElement !== startIn && document.activeElement !== endIn) showDates();
    rangeSel.value = !p.start && !p.end ? 'all' : !p.end && ['30', '90', '182'].find((d) => presetStart(Number(d)) === p.start) || 'custom';
    for (const b of $$('.tf-grain')) b.setAttribute('aria-pressed', String(b.dataset.grain === p.grain));
    $('.tf-basis').value = p.basis; $('.tf-dim').value = p.dim;
    $('.tf-sample').textContent = `Sample data · made-up trials through ${fDayY(toDate(cache.max))}`;

    // headline
    const rangeText = `${fDay(toDate(p.start || cache.min))} – ${fDayY(toDate(p.end || cache.max))}`;
    setKpi('kpi-trials', fInt(a.n), rangeText);
    setKpi('kpi-paid', a.n ? fPct(a.paid / a.n) : '—', `${fInt(a.paid)} paid accounts`);
    setKpi('kpi-free', a.n ? fPct(a.free / a.n) : '—', `${fInt(a.free)} moved to freemium`);
    setKpi('kpi-pql', fInt(a.pql), a.n ? `${fPct(a.pql / a.n)} of trials` : '');
    setKpi('kpi-arr', a.n ? fMoney(a.arr) : '—', a.paid ? `${fUsd(Math.round(a.arr / a.paid))} per paid account` : '');
    document.getElementById('kpi-paid').setAttribute('aria-pressed', String(p.sel_stage === 'paid'));
    document.getElementById('kpi-arr').setAttribute('aria-pressed', String(p.sel_stage === 'paid' && view.sort === 'arr'));
    document.getElementById('kpi-free').setAttribute('aria-pressed', String(p.sel_stage === 'free'));
    document.getElementById('kpi-pql').setAttribute('aria-pressed', String(p.sel_stage === 'pql'));
    document.getElementById('kpi-trials').setAttribute('aria-pressed', 'false');

    const paidPaths = d3.rollups(scope.filter((r) => r.paid), (v) => v.length, (r) => r.path).sort((x, y2) => y2[1] - x[1]);
    $('.tf-takeaway').textContent = !a.n ? 'No trials started in this date range.'
      : `${fInt(a.paid)} of ${fInt(a.n)} trials started ${rangeText} converted to paid (${fPct(a.paid / a.n)}), worth ${fMoney(a.arr)} in ARR.` +
        (paidPaths.length ? ` The most common paid path is ${paidPaths[0][0]} (${fInt(paidPaths[0][1])} accounts); ${fInt(a.free)} trials moved to freemium, and ${fInt(scope.filter((r) => r.free && r.paid).length)} of those later paid.` : '');

    drawLegend(scope, p);
    drawStack(scope, p);
    drawBreakdown(scope, p);
    drawTrends(scope, p);

    view.rows = scope.filter((r) => matches(r, p));
    view.scopeN = scope.length;
    drawChips(p, view.rows.length);
    drawRows();
  });
</script>
</body>
</html>
