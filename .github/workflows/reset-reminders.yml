name: Reset reminders
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      test_id:
        description: 'Send a test reminder now: a device id, or "all"'
        required: false
        default: ''
concurrency: reset-reminders
jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/reset-reminders
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install web-push
        working-directory: .github/reset-reminders
        run: npm install --no-save --no-package-lock web-push@3
      - name: Send due reminders
        working-directory: .github/reset-reminders
        env:
          PUSH_URL: ${{ secrets.RESET_PUSH_URL }}
          PUSH_KEY: ${{ secrets.RESET_PUSH_KEY }}
          VAPID_PUBLIC: BAX37UU_eqjFPBIHDjJSr8Ky790YLBLGV999b9PWPWQMDohEpasd9p_bp9w0GtbBmi-lx0wiZsb6LdfuSPqj7ME
          VAPID_PRIVATE: ${{ secrets.RESET_VAPID_PRIVATE }}
          TEST_ID: ${{ github.event.inputs.test_id }}
        run: node send.mjs
