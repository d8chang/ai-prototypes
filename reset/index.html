<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#3E6B52">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Reset">
<meta name="description" content="A 15-second check-in that suggests one small thing to help on a draining day.">

<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Reset Check-in</title>

<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF1EC; --card:#FFFFFF; --ink:#16201A; --ink2:#3B463F; --muted:#4F5A53;
  --line:#DDE3DE; --chip:#E1E7E2; --accent:#3E6B52; --accent-ink:#FFFFFF; --accent-soft:#DCE7DF; --link:#2F5A43;
  --sand:#CFC6B4; --stone1:#8E9A90; --stone2:#B4BDB3; --stone3:#6F7D72; --leaf:#7FA48A; --glow:#F6F1E6;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#141A16; --card:#1E2621; --ink:#EEF2EE; --ink2:#CBD5CE; --muted:#A9B4AC;
    --line:#2E3A33; --chip:#2A352E; --accent:#7FB394; --accent-ink:#0F1612; --accent-soft:#25362C; --link:#9CCBAE; --sand:#3A4139; --stone1:#5E6A61; --stone2:#46514A; --stone3:#76847A; --leaf:#5F8A6C; --glow:#1B231E;
  }
}
:root[data-theme="dark"]{
  --bg:#141A16; --card:#1E2621; --ink:#EEF2EE; --ink2:#CBD5CE; --muted:#A9B4AC;
  --line:#2E3A33; --chip:#2A352E; --accent:#7FB394; --accent-ink:#0F1612; --accent-soft:#25362C; --link:#9CCBAE; --sand:#3A4139; --stone1:#5E6A61; --stone2:#46514A; --stone3:#76847A; --leaf:#5F8A6C; --glow:#1B231E;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);background-image:radial-gradient(120% 60% at 50% 0%, var(--glow) 0%, transparent 70%);background-attachment:fixed;color:var(--ink);font-family:'Figtree',system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;min-height:100dvh}
.app{max-width:440px;margin:0 auto;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:10px;padding:16px 16px 12px;padding-top:max(16px,env(safe-area-inset-top))}
.logo{width:34px;height:30px;border-radius:52% 48% 46% 54% / 58% 56% 44% 42%;background:var(--accent);color:var(--accent-ink);display:flex;align-items:center;justify-content:center;font-weight:700}
.brand{font-weight:600;font-size:17px}
header .right{margin-left:auto;display:flex;gap:6px}
main{flex:1;padding:4px 16px 28px;display:flex;flex-direction:column;gap:14px}
h1{margin:0;font-size:26px;line-height:1.18;font-weight:700}
h2{margin:0;font-size:20px;line-height:1.25;font-weight:700}
p{margin:0;line-height:1.45}
.lead{font-size:16px;color:var(--ink2)}
.small{font-size:13px;color:var(--muted);line-height:1.4}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.card{background:var(--card);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:10px}
.bubble{align-self:flex-start;max-width:88%;background:var(--card);border-radius:18px 18px 18px 6px;padding:12px 14px;font-size:16px;line-height:1.4}
.mine{align-self:flex-end;background:var(--accent);color:var(--accent-ink);border-radius:18px 18px 6px 18px;padding:10px 14px;font-size:16px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
h1:focus,h2:focus{outline:none}
.chip{display:inline-flex;align-items:center;justify-content:center;font:inherit;font-size:15px;min-height:44px;padding:0 16px;border-radius:999px;border:1.5px solid var(--accent);background:var(--card);color:var(--link);cursor:pointer}
.chip:hover{background:var(--accent-soft)}
.chip.sel{background:var(--accent);color:var(--accent-ink)}
.status{align-self:flex-start;display:inline-flex;align-items:center;gap:8px;font-size:14px;font-weight:700;border-radius:999px;padding:6px 14px}
.status.on{background:var(--accent);color:var(--accent-ink)}
.status.off{background:var(--chip);color:var(--ink2)}
.status i{width:8px;height:8px;border-radius:50%;background:currentColor;display:inline-block}
.btn{font:inherit;font-size:16px;font-weight:600;min-height:50px;border-radius:999px;border:0;background:var(--accent);color:var(--accent-ink);cursor:pointer;width:100%}
.btn2{font:inherit;font-size:15px;min-height:46px;border-radius:999px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;width:100%}
.link{font:inherit;font-size:15px;background:none;border:0;color:var(--link);text-decoration:underline;cursor:pointer;padding:10px 4px;min-height:44px}
.iconbtn{font:inherit;font-size:14px;font-weight:600;min-height:40px;padding:0 12px;border-radius:999px;border:1.5px solid var(--accent);background:var(--card);color:var(--link);cursor:pointer}
label.f{font-size:14px;font-weight:600}
input[type=text],select{font:inherit;font-size:16px;min-height:46px;padding:0 12px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);width:100%}
.field{display:flex;flex-direction:column;gap:6px}
.row{display:flex;gap:8px}
.row>*{flex:1}
.timer{align-self:center;width:150px;height:150px;border-radius:50%;background:var(--accent-soft);display:flex;align-items:center;justify-content:center}
.timer div{width:110px;height:110px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:700;font-variant-numeric:tabular-nums}
ol.steps{margin:0;padding-left:20px;line-height:1.5;color:var(--ink2)}
textarea{font:inherit;font-size:16px;width:100%;min-height:150px;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);resize:vertical}
textarea.line{min-height:56px}
.breath{align-self:center;width:150px;height:150px;border-radius:50%;background:var(--accent-soft);animation:breath 10s ease-in-out infinite}
@keyframes breath{0%{transform:scale(.6)}40%{transform:scale(1)}100%{transform:scale(.6)}}
@media (prefers-reduced-motion: reduce){.breath{animation:none}}
.draw{position:relative;align-self:center;width:260px;height:260px;background:var(--card);border-radius:18px}
.draw svg,.draw canvas{position:absolute;inset:0;width:100%;height:100%}
.draw svg{fill:none;stroke:var(--muted);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.draw svg g{opacity:.3}
.draw svg g.now{stroke:var(--accent);opacity:1}
.draw svg .dot{fill:var(--muted)}
.draw canvas{touch-action:none}
.hero{display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px;margin:-4px 0 4px}
.hero h1{margin:0}.zen{width:180px;height:auto;display:block}
.card,.tile{border-radius:20px}
.topback{flex:0 0 auto}
.toprow{display:flex;align-items:center;justify-content:space-between;gap:8px}
.toprow h1{margin:0}
.gear{display:flex;align-items:center;justify-content:center;padding:0;width:44px;height:44px;flex:0 0 44px;border-radius:50%;border:1.5px solid var(--line);background:var(--card);color:var(--ink2);cursor:pointer}
.btn.big{min-height:64px;font-size:18px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{font:inherit;text-align:left;display:flex;flex-direction:column;gap:2px;padding:14px;border-radius:16px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;min-height:72px}
.tile b{font-size:15px}.tile span{font-size:13px;color:var(--muted)}
.links{display:flex;justify-content:center;flex-wrap:wrap;gap:4px 18px}
.strip{font:inherit;font-size:15px;text-align:left;min-height:48px;padding:10px 14px;border-radius:14px;border:1px dashed var(--accent);background:var(--card);color:var(--link);cursor:pointer;width:100%}
.entry{font:inherit;text-align:left;border:0;width:100%;cursor:pointer;color:var(--ink);height:120px;overflow:hidden;position:relative}
.entry .body{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;line-height:1.4}
.entry .body p{margin:0}
.entry.open{height:auto}
.entry.open .body{display:block}
.entry .more{font-size:13px;color:var(--link)}
.bar{height:8px;border-radius:4px;background:var(--chip);overflow:hidden}
.bar>i{display:block;height:8px;background:var(--accent);border-radius:4px}
.stat{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stat div{background:var(--card);border-radius:16px;padding:12px}
.stat b{display:block;font-size:24px;color:var(--link)}
.facts>div{padding:12px 0;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:3px}
.facts>div:last-child{border-bottom:0}
.facts b{font-size:15px}
.facts span{font-size:14px;color:var(--ink2);line-height:1.4}
.note{font-size:13px;color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
a{color:var(--link)}
:focus-visible{outline:3px solid var(--link);outline-offset:2px}
.foot{margin-top:auto;padding-top:8px}
.progress{display:flex;gap:6px;justify-content:center}
.progress span{width:24px;height:6px;border-radius:3px;background:var(--line)}
.progress span.on{background:var(--accent)}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="logo" aria-hidden="true">R</div>
    <div class="brand">Reset</div>
    <div class="right" id="hdr"></div>
  </header>
  <main id="view" aria-live="polite"></main>
</div>

<script>
/* ======================= Reset v2 (smallest version) =======================
   Everything is stored on this device only (localStorage). Nothing is sent
   anywhere unless CONFIG.syncUrl is set later for a pilot.
   Changes from v1, each tied to tester feedback (timeline item numbers):
   - Sign-up says what you get, with a sample (3, 11, 13)
   - Reminder at a moment you pick, as a phone notification, not email (1, 5, 8)
   - "Where are you?" filters ideas (16); no social ideas unless you say so (2)
   - No budget question: all ideas are free (15); "Not this one" and Back (14)
   - "Did it help?" with a one-line reason why it asks (6)
   - Weekly recap in plain counts with a clear title (9, 17)
   - Kind silence: no streaks, "welcome back" after a gap (10)
   - Short privacy summary + details + delete my data (6, 13)
============================================================================ */
var CONFIG = { syncUrl: null, version: '2.2' };
var KEY = 'reset_v2';

/* ---------- storage (safe) ---------- */
var mem = null;
function load(){
  if (mem) return mem;
  try { var raw = localStorage.getItem(KEY); mem = raw ? JSON.parse(raw) : null; } catch(e){ mem = null; }
  if (!mem) mem = { profile:null, checkins:[], pulses:[] };
  if (!mem.journal) mem.journal = [];
  return mem;
}
function save(){ try { localStorage.setItem(KEY, JSON.stringify(mem)); } catch(e){} }
function wipe(){ mem = { profile:null, checkins:[], pulses:[] }; try { localStorage.removeItem(KEY); } catch(e){} }

/* ---------- activities (all free) ----------
   where: desk | home | out (any = all three). energy: low | med. social: true = involves another person. */
var ACTS = [
 {id:'stretch', name:'Stand and stretch', cat:'Movement', min:5, where:['desk','home','out'], energy:'low', line:'Shoulders, neck, wrists. Right where you are.', steps:['Roll your shoulders back 5 times.','Tilt your head side to side, slowly.','Reach up, then fold forward gently.']},
 {id:'shoulders', name:'Shoulder and neck release', cat:'Movement', min:5, where:['desk','home'], energy:'low', line:'Undo the desk hunch.', steps:['Drop your shoulders away from your ears.','Hold each side stretch for 20 seconds.','Finish with 3 slow breaths.']},
 {id:'walk5', name:'Quick walk', cat:'Movement', min:5, where:['desk','home','out'], energy:'low', line:'Down the hall, around the block, anywhere.', steps:['Leave your phone in your pocket.','Walk at an easy pace.','Notice one thing you have not seen before.']},
 {id:'walk15', name:'Walk outside', cat:'Movement', min:15, where:['home','out'], energy:'med', line:'Fresh air resets more than you think.', steps:['Pick a direction and go.','Turn back halfway.']},
 {id:'stairs', name:'Take the stairs once', cat:'Movement', min:5, where:['desk','out'], energy:'med', line:'Short burst, quick lift.', steps:['Up one or two floors at an easy pace.','Pause at the top for 3 breaths.']},
 {id:'yoga', name:'Gentle floor stretch', cat:'Movement', min:15, where:['home'], energy:'low', line:'Lie down and let your back unwind.', steps:['Knees to chest for 1 minute.','Gentle twist each side.','Rest flat for 2 minutes.']},
 {id:'breath', name:'Slow breathing', cat:'Mind', min:5, where:['desk','home','out'], energy:'low', line:'In for 4, out for 6. Follow the circle.', steps:['Breathe in as the circle grows.','Breathe out as it shrinks.'], kind:'breathe'},
 {id:'window', name:'Look out a window', cat:'Mind', min:5, where:['desk','home'], energy:'low', line:'Let your eyes rest on something far away.', steps:['Find the farthest thing you can see.','Watch it for a full minute.']},
 {id:'see5', name:'Five things you can see', cat:'Senses', min:5, where:['desk','home','out'], energy:'low', line:'A quick way back into the room.', steps:['Name 5 things you see.','Then 4 you can hear.','Then 3 you can touch.']},
 {id:'water', name:'Drink a glass of water', cat:'Nourishment', min:1, where:['desk','home','out'], energy:'low', line:'Simple, and it often helps.', steps:['Fill a glass.','Drink it slowly, away from the screen.']},
 {id:'tea', name:'Make a warm drink', cat:'Nourishment', min:5, where:['desk','home'], energy:'low', line:'Tea, coffee or hot water. The ritual is the point.', steps:['Make it without your phone.','Hold the cup and take the first sip slowly.']},
 {id:'snack', name:'Have a real snack', cat:'Nourishment', min:5, where:['desk','home'], energy:'low', line:'Low energy is sometimes just hunger.', steps:['Pick something with protein if you can.','Eat it away from your screen.']},
 {id:'desk', name:'Clear one corner of your desk', cat:'Environment', min:5, where:['desk','home'], energy:'low', line:'A small win you can see.', steps:['Pick one corner.','Put away or toss 5 things.']},
 {id:'air', name:'Open a window or step outside', cat:'Environment', min:1, where:['desk','home'], energy:'low', line:'A change of air changes the moment.', steps:['Open it wide for a few minutes.','Take 3 deep breaths of fresh air.']},
 {id:'music', name:'One song, eyes closed', cat:'Senses', min:5, where:['desk','home','out'], energy:'low', line:'Headphones on, everything else off.', steps:['Pick a song you love.','Close your eyes for the whole thing.']},
 {id:'doodle', name:'Doodle for five minutes', cat:'Play', min:5, where:['desk','home'], energy:'low', line:'No skill needed. Just shapes.', steps:['Grab any paper.','Draw circles, lines, anything.']},
 {id:'hobby', name:'Time on your hobby', cat:'Play', min:15, where:['home'], energy:'med', line:'Something you do just because you like it.', steps:['Get it out.','Start anywhere, even badly.']},
 {id:'cards', name:'Quick card or puzzle game', cat:'Play', min:5, where:['home'], energy:'low', line:'A small, finishable thing.', steps:['One round only.']},
 {id:'boundary', name:'Close one tab or task for today', cat:'Boundaries', min:2, where:['desk'], energy:'low', line:'Give yourself permission to stop one thing.', steps:['Pick one thing that can wait until tomorrow.','Write it down, then close it.']},
 {id:'endday', name:'Write tomorrow’s top three', cat:'Boundaries', min:5, where:['desk','home'], energy:'low', line:'Get them out of your head so you can stop for today.', steps:[], kind:'journal', prompts:['Most important tomorrow','Second','Third'], note:''},
 {id:'journal1', name:'One-line journal', cat:'Journaling', min:5, where:['desk','home','out'], energy:'low', line:'One easy prompt. One line is enough.', steps:[], kind:'journal', n:1},
 {id:'gratitude', name:'Three things I’m grateful for', cat:'Journaling', min:5, where:['desk','home','out'], energy:'low', line:'Small things count. A warm drink, a kind message, a quiet minute.', steps:[], kind:'journal', prompts:['One thing I’m grateful for today','Another one','One more, even something small'], note:''},
 {id:'journal3', name:'Three-line journal', cat:'Journaling', min:15, where:['desk','home'], energy:'low', line:'Three easy prompts. A line each.', steps:[], kind:'journal', n:3},
 {id:'bear', name:'Draw a simple bear', cat:'Senses', min:5, where:['desk','home'], energy:'low', line:'Six easy steps. No skill needed.', steps:[], kind:'draw'},
 {id:'cat', name:'Draw a sleepy cat', cat:'Senses', min:5, where:['desk','home'], energy:'low', line:'Six easy steps. No skill needed.', steps:[], kind:'draw'},
 {id:'bunny', name:'Draw a bunny with a floppy ear', cat:'Senses', min:5, where:['desk','home'], energy:'low', line:'Five easy steps. No skill needed.', steps:[], kind:'draw'},
 {id:'shower', name:'Warm shower', cat:'Body care', min:15, where:['home'], energy:'low', line:'Let the water do the work.', steps:['Take your time.','Finish with 10 seconds of cooler water if you like.']},
 {id:'lie', name:'Lie down with eyes closed', cat:'Rest', min:15, where:['home'], energy:'low', line:'Rest without needing to sleep.', steps:['Set the timer.','Let your body feel heavy.']},
 {id:'bench', name:'Sit somewhere and people-watch', cat:'Mind', min:15, where:['out'], energy:'low', line:'No goal. Just watch the world.', steps:['Find a seat.','Leave your phone away.']},
 {id:'spa', name:'Book a massage or spa visit', cat:'Body care', min:30, where:['home','out'], energy:'low', paid:true, line:'A real break you can look forward to. This one costs money.', steps:['Look up a place near you.','Pick a time today or this week.'], book:true},
 {id:'mute', name:'Mute notifications for an hour', cat:'Boundaries', min:2, where:['desk','home'], energy:'low', line:'Give yourself one quiet hour.', steps:['Phone: Do Not Disturb for 1 hour.','Slack or chat: pause notifications for 1 hour.']},
 {id:'endtime', name:'Set an end time for today', cat:'Boundaries', min:2, where:['desk','home'], energy:'low', line:'Pick the time you will close the laptop.', steps:['Pick your stop time.','Put it on your calendar.']},
 {id:'dayoff', name:'Book a day off', cat:'Boundaries', min:5, where:['desk','home'], energy:'low', line:'Pick a date and put it in your calendar.', steps:['Pick a date. You can change it later.','Put it on your calendar.']},
 {id:'focus', name:'Block focus time tomorrow', cat:'Boundaries', min:2, where:['desk','home'], energy:'low', line:'Thirty minutes with nothing booked.', steps:['Find a free 30 minutes tomorrow.','Put “Focus time” on your calendar.']},
 {id:'benefit', name:'Look up your therapy benefit', cat:'Support', min:5, where:['desk','home'], energy:'low', line:'See what your employer covers. Just look, nothing to book.', steps:['Open your benefits site.','Search for “EAP” or “mental health.”','Note how many free sessions you get.']},
 {id:'closeeyes', name:'Close your eyes for five minutes', cat:'Rest', min:5, where:['desk','home'], energy:'low', line:'Set the timer and do nothing.', steps:['Phone face down.','Eyes closed.']},
 {id:'walkcall', name:'Take a call while walking', cat:'Movement', min:15, where:['desk','home','out'], energy:'med', line:'Your next one-on-one, on foot.', steps:['Pick a call that needs no screen.','Earbuds in, out the door.']},
 {id:'lunch', name:'Lunch away from your desk', cat:'Nourishment', min:15, where:['desk','home'], energy:'low', line:'No screen while you eat.', steps:['Close the laptop.','Eat somewhere else.']},
 {id:'hobby5', name:'Five minutes on your hobby', cat:'Play', min:5, where:['home'], energy:'low', line:'Pick it up with no goal. Five minutes counts.', steps:['Get it out and start anywhere.']},
 {id:'hobby30', name:'Ten minutes on a hobby, then more', cat:'Play', min:30, where:['home'], energy:'med', line:'Start small and see where it goes.', steps:['Get your hobby out.','Keep going if you like it.']},
 {id:'read', name:'Read a few pages for fun', cat:'Play', min:15, where:['desk','home','out'], energy:'low', line:'Nothing for work. Something you enjoy.', steps:['Open to where you left off.']},
 {id:'butterfly', name:'Butterfly hug', cat:'Senses', min:2, where:['desk','home','out'], energy:'low', line:'A slow, steady tap that settles you.', steps:['Cross your arms over your chest.','Tap one shoulder, then the other, slowly.']},
 {id:'hands', name:'Slow hand massage', cat:'Senses', min:2, where:['desk','home','out'], energy:'low', line:'Lotion if you have it. Thumbs into palms.', steps:['Press your thumb into the other palm.','Move slowly, one finger at a time.']},
 {id:'boat', name:'Fold a paper boat', cat:'Senses', min:15, where:['desk','home'], energy:'low', line:'Any rectangle of paper works.', steps:['Fold in half, top to bottom.','Fold the top corners to the middle.','Fold the bottom strips up, one each side.','Open the bottom and flatten into a diamond.','Fold the bottom points up to the top.','Open into a diamond again, then pull the top points apart.']},
 {id:'prayer', name:'A quiet moment of prayer or reflection', cat:'Faith and meaning', min:5, where:['desk','home','out'], energy:'low', line:'However you practice, or just a still minute.', steps:['Sit somewhere quiet.','Pray, reflect, or simply be still.']},
 {id:'sitout', name:'Sit outside', cat:'Environment', min:15, where:['home','out'], energy:'low', line:'No phone. Just sit.', steps:['Step outside and find a seat.']},
 {id:'phonefree', name:'Phone-free hour', cat:'Rest', min:30, where:['home'], energy:'low', line:'Put it in another room.', steps:['Set a 1-hour alarm.','Put your phone in another room.','Walk, cook or read.']},
 {id:'winddown', name:'Wind down for bed', cat:'Rest', min:30, where:['home'], energy:'low', line:'Thirty calm minutes before lights-out.', steps:['Dim the lights. Phone across the room.','Wash up.','Write tomorrow’s first task.','Read or breathe slowly.']},
 {id:'bath', name:'Bath', cat:'Body care', min:30, where:['home'], energy:'low', line:'Light a candle if you have one.', steps:['Run warm water.','Dim the lights. No phone.']},
 {id:'longwalk', name:'Long walk outside', cat:'Movement', min:30, where:['home','out'], energy:'med', line:'No destination needed.', steps:['Shoes on. No destination needed.']},
 {id:'facemask', name:'Face mask', cat:'Body care', min:15, where:['home'], energy:'low', paid:true, line:'Ten minutes of doing nothing else.', steps:['Put it on, then sit back.']},
 {id:'cook', name:'Cook one simple meal', cat:'Nourishment', min:30, where:['home'], energy:'med', paid:true, line:'Something you have made before.', steps:['One pan.','Eat sitting down.']},
 {id:'coffee', name:'Coffee with someone', cat:'Connection', min:30, where:['desk','home','out'], energy:'med', social:true, paid:true, book:true, line:'Ask one person you like.', steps:['Ask one person.','Suggest a day.']},

/* ---------- personal stats: honest counts ---------- */
function statsByActivity(){
  var d = load(), m = {};
  d.checkins.forEach(function(c){
    if (!c.helped) return;
    var k = c.act; m[k] = m[k] || {n:0, yes:0};
    m[k].n++; if (c.helped !== 'no') m[k].yes++;
  });
  return m;
}

/* ---------- picking an idea ---------- */
function candidates(){
  var d = load(), recent = d.checkins.slice(-3).map(function(c){ return c.act; });
  var st = statsByActivity();
  var list = ACTS.filter(function(a){
    if (a.min > S.time) return false;
    if (!a.where.some(function(w){ return FITS[S.where].indexOf(w) >= 0; })) return false;
    if (a.social && S.people !== 'yes') return false;
    if (a.paid && !(d.profile && d.profile.paid)) return false;  // paid ideas only if opted in
    if (S.mood <= 2 && a.energy !== 'low') return false;
    if (S.skipped.indexOf(a.id) >= 0) return false;
    return true;
  });
  list.forEach(function(a){
    var s = 1 + Math.random();                       // variety
    if (recent.indexOf(a.id) >= 0) s -= 3;           // not the same thing again
    var p = st[a.id];
    if (p && p.n >= 2) s += 2 * (p.yes / p.n) - 1;   // only after 2 tries of your own
    if (S.mood <= 2 && a.cat === 'Movement') s += 0.5; // pilot: movement lifted mood most often
    a._s = s;
  });
  list.sort(function(x,y){ return y._s - x._s; });
  return list;
}
function whyLine(a){
  var p = statsByActivity()[a.id];
  if (p && p.n >= 2) return 'It has helped you ' + p.yes + ' of ' + p.n + ' times.';
  var place = S.where==='office' ? 'at the office' : S.where==='home' ? 'at home' : 'outside';
  return (a.min <= 1 ? 'Takes about a minute' : 'Takes about ' + a.min + ' minutes') + '. Works ' + place + (a.paid ? '.' : ', and it’s free.');
}

    var src = ctx.createBufferSource(); src.buffer = buf; src.loop = true;
    var f = ctx.createBiquadFilter(); f.type = kind==='rain' ? 'highpass' : 'lowpass'; f.frequency.value = kind==='rain' ? 900 : 700;
    var g = ctx.createGain(); g.gain.value = 0.0001; g.gain.exponentialRampToValueAtTime(kind==='rain'?0.08:0.25, ctx.currentTime+1.5);
    src.connect(f); f.connect(g); g.connect(ctx.destination);
    if (kind==='brook'){ var lfo = ctx.createOscillator(), lg = ctx.createGain(); lfo.frequency.value = 0.15; lg.gain.value = 250; lfo.connect(lg); lg.connect(f.frequency); lfo.start(); }
    src.start(); snd = { ctx:ctx, kind:kind };
  }catch(e){ snd = null; }
}
var sndOpen = false;
var SND_NAMES = { rain:'Rain', brook:'Brook', cafe:'Café' };
function soundBar(){
  var cur = snd ? snd.kind : '';
  var inner = !sndOpen
    ? '<button class="iconbtn" data-sndopen="1" aria-expanded="false">♪ '+(cur ? SND_NAMES[cur]+' · change' : 'Sound')+'</button>'
    : '<div class="row" style="justify-content:center;gap:6px;flex-wrap:wrap">'+
      [['rain','Rain'],['brook','Brook'],['cafe','Café'],['','Off']].map(function(o){
        return '<button class="chip'+(cur===o[0]?' sel':'')+'" data-sound="'+o[0]+'" style="flex:0 0 auto;min-height:40px" aria-pressed="'+(cur===o[0])+'">'+o[1]+'</button>'; }).join('')+'</div>';
  return '<div class="sndbar" aria-label="Background sound" style="display:flex;flex-direction:column;align-items:center;gap:4px">'+inner+
    '</div>';
}

/* ---------- phone notifications (iPhone/Android app only) ----------
   In the app build (Capacitor), reminders are real notifications. Each one carries a small action
   you can do right away, so it helps even if you never open the app (feedback 20, 18).
   On the web, the push reminders below are used instead. */
var NUDGES = [
  ['{n}! Take a deep breath.', 'In for 4, out for 6. Three times. That’s it.'],
  ['Shoulders check, {n}.', 'Drop them away from your ears and roll them back 5 times.'],
  ['Water break?', 'One glass, away from the screen. Small counts.'],
  ['Look up for a sec, {n}.', 'Find the farthest thing you can see and rest your eyes on it for 20 seconds.'],
  ['Unclench your jaw.', 'Seriously. Now your shoulders. Nice.'],
  ['One-minute stretch?', 'Stand up, reach for the ceiling, fold forward gently.'],
  ['{n}, you did enough today.', 'Name one thing that went okay. Tap if you want one more idea.'],
  ['Tiny walk?', 'Down the hall and back. Notice one thing you haven’t seen before.']
];
function isNative(){ try{ return !!(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform()); }catch(e){ return false; } }
var lnPlugin = null;
function LN(){
  var c = window.Capacitor; if (!c || !isNative()) return null;
  if (lnPlugin) return lnPlugin;
  if (c.Plugins && c.Plugins.LocalNotifications) lnPlugin = c.Plugins.LocalNotifications;
  else if (c.registerPlugin) lnPlugin = c.registerPlugin('LocalNotifications');
  return lnPlugin;
}
var nudgeListening = false;
function nudgeSetup(){
  var ln = LN(); if (!ln || nudgeListening) return; nudgeListening = true;
  ln.registerActionTypes({ types:[{ id:'NUDGE', actions:[{ id:'did', title:'Did it', foreground:true }, { id:'more', title:'Check in', foreground:true }] }] });
  ln.addListener('localNotificationActionPerformed', function(e){
    var d = load(); if (!d.profile) return Screens.welcome();
    if (e && e.actionId === 'did'){
      d.nudges = d.nudges || []; d.nudges.push({ t:now(), nudge:(e.notification && e.notification.extra && e.notification.extra.nudge) }); save();
      header(); render('<h2>Nice. That counts.</h2><p class="lead">'+esc(GRACE[d.nudges.length % GRACE.length])+'</p><button class="btn" data-go="home">Done</button><button class="btn2" data-go="checkin">One more idea</button>');
      return;
    }
    Screens.checkin();
  });
}
function scheduleNudges(){
  var ln = LN(), p = load().profile; if (!ln || !p) return Promise.resolve(false);
  return ln.requestPermissions().then(function(r){
    if (!r || r.display !== 'granted') return false;
    return ln.getPending().then(function(pend){
      var old = (pend && pend.notifications || []).map(function(x){ return { id:x.id }; });
      return old.length ? ln.cancel({ notifications: old }) : null;
    }).then(function(){
      var hm = p.time.split(':'), days = p.freq==='daily' ? [1,2,3,4,5,6,7] : p.freq==='weekdays' ? [2,3,4,5,6] : [2,4,6];
      var start = (load().nudgeRot || 0); var d = load(); d.nudgeRot = start + days.length; save();
      var list = days.map(function(w, k){ var n = NUDGES[(start + k) % NUDGES.length];
        return { id:100+w, title:n[0].replace('{n}', p.name), body:n[1].replace('{n}', p.name), actionTypeId:'NUDGE', extra:{ nudge:(start+k)%NUDGES.length },
                 schedule:{ on:{ weekday:w, hour:+hm[0], minute:+hm[1] }, allowWhileIdle:true } }; });
      return ln.schedule({ notifications:list }).then(function(){ var d2 = load(); d2.profile.notify = true; save(); return true; });
    });
  }).catch(function(){ return false; });
}

/* ---------- web reminders (push notifications) ----------
   A small free server (Apps Script list + a GitHub job every 15 minutes) sends each
   reminder at the chosen time. It stores only a random device id, the browser's push
   address, the time, how often and the time zone. Your name stays on this phone and is
   added to the notification by the phone itself. */
var PUSH = { url:'https://script.google.com/macros/s/AKfycbweUfx_dGa194qy5thBIKeA-LLzKfU5RldvZTp06cyuzyGJTxTw9eEBwEWACWLnq8kc/exec', key:'BAX37UU_eqjFPBIHDjJSr8Ky790YLBLGV999b9PWPWQMDohEpasd9p_bp9w0GtbBmi-lx0wiZsb6LdfuSPqj7ME' };
function webPushOK(){ try{ return !isNative() && PUSH.url.indexOf('https://')===0 && location.protocol==='https:' && 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window; }catch(e){ return false; } }
function isIOS(){ return /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform==='MacIntel' && navigator.maxTouchPoints>1); }
function standalone(){ return (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone===true; }
function needsHomeScreen(){ return !isNative() && isIOS() && !standalone(); }
function isAndroid(){ return /Android/.test(navigator.userAgent); }
function homeScreenSteps(){
  if (isIOS()) return '<div class="card"><div class="eyebrow">Add Reset to your Home Screen first</div><ol class="steps">'+
    '<li>At the bottom of Safari, tap the <strong>Share</strong> button (the square with an arrow pointing up).</li>'+
    '<li>Scroll down and tap <strong>Add to Home Screen</strong>, then <strong>Add</strong>.</li>'+
    '<li>Open Reset from the new icon on your Home Screen, and come back here to turn on reminders.</li></ol>'+
    '<p class="small">Using Chrome on iPhone? Open this page in Safari first. The Home Screen app starts fresh, so you’ll set it up once more there.</p></div>';
  if (isAndroid()) return '<div class="card"><div class="eyebrow">Add Reset to your Home Screen first</div><ol class="steps">'+
    '<li>In Chrome, tap the <strong>⋮</strong> menu at the top right.</li>'+
    '<li>Tap <strong>Add to Home screen</strong> or <strong>Install app</strong>.</li>'+
    '<li>Open Reset from the new icon, and come back here to turn on reminders.</li></ol></div>';
  return '<div class="card"><div class="eyebrow">One step first</div><p>Open Reset in Chrome or Safari, then come back here to turn on reminders.</p></div>';
}
function keyBytes(s){ s=s.replace(/-/g,'+').replace(/_/g,'/'); while (s.length%4) s+='='; var r=atob(s), a=new Uint8Array(r.length); for (var i=0;i<r.length;i++) a[i]=r.charCodeAt(i); return a; }
function rid(){ var c='abcdefghijklmnopqrstuvwxyz0123456789', s=''; var a=new Uint8Array(24); crypto.getRandomValues(a); for (var i=0;i<a.length;i++) s+=c[a[i]%c.length]; return s; }
function savePrefs(){ try{ var d=load(), p=d.profile||{}; caches.open('reset-prefs').then(function(c){ return c.put('prefs', new Response(JSON.stringify({ name:p.name||'', id:d.pushId||'', time:p.time||'', freq:p.freq||'', tz:Intl.DateTimeFormat().resolvedOptions().timeZone, url:PUSH.url, key:PUSH.key }))); }); }catch(e){} }
function postPush(body){ return fetch(PUSH.url, { method:'POST', mode:'no-cors', headers:{'Content-Type':'text/plain'}, body:JSON.stringify(body) }); }
function pushOn(){
  if (!webPushOK()) return Promise.resolve('unsupported');
  if (needsHomeScreen()) return Promise.resolve('ios');
  return Notification.requestPermission().then(function(perm){
    if (perm !== 'granted') return 'denied';
    return navigator.serviceWorker.register('sw.js').then(function(){ return navigator.serviceWorker.ready; }).then(function(reg){
      return reg.pushManager.getSubscription().then(function(s){ return s || reg.pushManager.subscribe({ userVisibleOnly:true, applicationServerKey:keyBytes(PUSH.key) }); });
    }).then(function(sub){
      var d=load(), p=d.profile; d.pushId = d.pushId || rid(); save(); savePrefs();
      return postPush({ action:'subscribe', id:d.pushId, sub:sub.toJSON(), time:p.time, freq:p.freq, tz:Intl.DateTimeFormat().resolvedOptions().timeZone }).then(function(){ var d2=load(); d2.profile.push=true; save(); return 'on'; });
    });
  }).catch(function(){ return 'error'; });
}
function pushOff(){
  var d=load(); if (!d.pushId) return Promise.resolve();
  var id=d.pushId; if (d.profile) d.profile.push=false; save();
  var p1 = postPush({ action:'unsubscribe', id:id }).catch(function(){});
  var p2 = ('serviceWorker' in navigator) ? navigator.serviceWorker.getRegistration().then(function(reg){ return reg && reg.pushManager.getSubscription(); }).then(function(s){ return s && s.unsubscribe(); }).catch(function(){}) : null;
  return Promise.all([p1,p2]);
}
/* Tapped a reminder: show its small action with big, visible choices (notification buttons can be hidden). */
function nudgeScreen(i){
  var d=load(); if (!d.profile) return Screens.welcome();
  var n = NUDGES[(i||0) % NUDGES.length], name = d.profile.name;
  header(); render('<div class="small">Your reminder</div><h1>'+esc(n[0].replace('{n}', name))+'</h1><p class="lead">'+esc(n[1].replace('{n}', name))+'</p>'+
  '<button class="btn" data-go="nudgeDid">I did it</button>'+
  '<button class="btn2" data-go="checkin">Give me one idea</button>'+
  '<div class="links"><button class="link" data-go="home">Never mind</button></div>');
}
/* Tapped "Did it" on a reminder: count it, no check-in needed. */
function nudgeDone(){
  var d=load(); if (!d.profile) return Screens.welcome();
  d.nudges = d.nudges || []; d.nudges.push({ t:now() }); save(); shareEvent({ type:'nudge', day:dayStr(now()) });
  header(); render('<h2>Nice. That counts.</h2><p class="lead">'+esc(GRACE[d.nudges.length % GRACE.length])+'</p><button class="btn" data-go="home">Done</button><button class="btn2" data-go="checkin">One more idea</button>');
}


/* ---------- router + events ---------- */
function go(name){
  clearInterval(tick);
  if (name==='notify'){ var nb=document.querySelector('[data-go="notify"]'); scheduleNudges().then(function(ok){ if (nb) nb.textContent = ok ? 'Reminders are on' : 'Notifications are off. Turn them on in Settings, then try again'; }); return; }
  if (name==='push'){ var pb=document.querySelector('[data-go="push"]'); if (pb) pb.textContent='Turning on…';
    pushOn().then(function(r){ if (r==='on' && document.querySelector('.status')) return Screens.settings(); if (r==='on'){ var st=document.createElement('span'); st.className='status on'; st.innerHTML='<i></i>Reminders on'; pb.replaceWith(st); return; } if (!pb) return; pb.textContent = r==='on' ? 'Reminders are on' : r==='denied' ? 'Notifications are blocked. Allow them in your settings, then try again' : r==='ios' ? 'First add Reset to your Home Screen' : 'Couldn’t turn them on. Try again in a moment'; }); return; }
  if (name==='nudgeDid'){ return nudgeDone(); }
  if (name==='pushOff'){ pushOff().then(function(){ Screens.settings(); }); return; }
  if (name==='start'){ return startActivity(); }
  if (name==='togglePaid'){ var d=load(); d.profile.paid=!d.profile.paid; save(); return Screens.settings(); }
  if (name==='another'){ S.skipped.push(S.act); return showIdea(); }
  if (name==='back'){ S.skipped.push(S.act); return showIdea(); }
  if (name==='stepMood') return stepMood();
  if (name==='stepTime') return stepTime();
  if (name==='stepWhere') return stepWhere();
  if (name==='qbreath'){ S = { skipped:[], direct:true, fromHome:true, act:'breath' }; return showBreathe(act('breath')); }
  if (name==='qgrat'){ S = { skipped:[], direct:true, fromHome:true, act:'gratitude' }; return showJournal(act('gratitude')); }
  if (name==='jgrat'){ S = { skipped:[], direct:true, act:'gratitude' }; return showJournal(act('gratitude')); }
  if (name==='jwrite'){ S = { skipped:[], direct:true, act:'journal3' }; return showJournal(act('journal3')); }
  if (name==='jletgo'){ document.querySelectorAll('textarea').forEach(function(t){ t.value=''; }); name='done'; }
  if (name==='done'){ saveJournal(); if (S.direct){ var fh=S.fromHome; S.journalSaved=false; soundStop(); return fh ? Screens.home() : Screens.journal(); } var c = record(true); return askHelped(c); }
  if (name==='later'){ if (S.direct) return Screens.home(); var c2 = record(false); return askWhy(c2); }
  if (name==='booked'){ var c3 = record('booked'); render('<h2>Nice. Enjoy it.</h2><p class="lead">It’ll wait on your home screen. Tap it after you’ve been.</p><button class="btn" data-go="home">Done for today</button>'); return; }
  if (name==='vent'){ return showVent(); }
  if (name==='ventsave' || name==='ventdone'){
    var v=document.getElementById('vent'), txt = v ? v.value.trim() : '';
    if (txt){ S.vented = true; if (name==='ventsave'){ var dj=load(); dj.journal.push({ t:now(), title:'Free write', lines:[{q:'',a:txt}] }); save(); } }
    if (v) v.value='';
    if (S.fromJournal){ var note = name==='ventsave' && txt ? 'Saved. Only you can see it.' : 'Let go. Nothing was saved.';
      Screens.journal(); var h=document.querySelector('#view .small'); if (h && txt) h.textContent = note; return; }
    header(); render('<h2>'+(name==='ventsave' && txt ? 'Saved to your journal.' : txt ? 'Let go. Nothing was saved.' : 'Okay.')+'</h2>'+
      (name==='ventsave' && txt ? '<p class="small">Only on this phone. No one else can see it.</p>' : '')+
      '<p class="lead">Want one small thing to do now, or are you done for now?</p>'+
      '<button class="btn" data-go="ventback">Continue check-in</button><button class="btn2" data-go="home">Back home</button>');
    return; }
  if (name==='ventback'){ return stepMood(); }
  if (name==='jnext'){ S.jStart = (S.jStart||0) + 3; return showJournal(act(S.act)); }
  if (name==='dnext'){ return showDraw(act(S.act), S.drawStep+1); }
  if (name==='dundo'){ padHist.pop(); return paint(); }
  if (name==='dclear'){ padHist = []; return paint(); }
  if (name==='bookeddone'){ return; }
  (Screens[name] || Screens.home)();
}
document.addEventListener('click', function(e){
  var b = e.target.closest('button'); if (!b) return;
  if (b.dataset.go) return go(b.dataset.go);
  if (b.dataset.mood){ S.mood = +b.dataset.mood; return stepTime(); }
  if (b.dataset.time){ S.time = +b.dataset.time; return stepWhere(); }
  if (b.dataset.where){ S.where = b.dataset.where; return afterWhere(); }
  if (b.dataset.people){ S.people = b.dataset.people; return showIdea(); }
  if (b.dataset.themePick){ try{ localStorage.setItem('reset_theme', b.dataset.themePick); }catch(x){} applyTheme(b.dataset.themePick); return Screens.settings(); }
  if (b.dataset.sndopen){ sndOpen = true; b.closest('.sndbar').outerHTML = soundBar(); return; }
  if (b.dataset.sound !== undefined){ soundPlay(b.dataset.sound); sndOpen = false; b.closest('.sndbar').outerHTML = soundBar(); return; }
  if (b.dataset.entry){ var open = b.classList.toggle('open'); b.setAttribute('aria-expanded', open); var m=b.querySelector('.more'); if (m) m.textContent = open ? 'Tap to collapse' : 'Tap to read all'; return; }
  if (b.dataset.help){ return setHelped(b.dataset.t, b.dataset.help); }
  if (b.dataset.why){ var d0=load(); d0.checkins.forEach(function(c){ if (String(c.t)===b.dataset.t) c.why=b.dataset.why; }); save(); return Screens.home(); }
  if (b.dataset.happened){ var d1=load(); d1.checkins.forEach(function(c){ if (String(c.t)===b.dataset.t){ c.did = b.dataset.happened==='yes'; if (!c.did) c.why='Didn’t happen'; } }); save();
    var c4 = d1.checkins.filter(function(c){ return String(c.t)===b.dataset.t; })[0]; return c4.did ? askHelped(c4) : Screens.home(); }
  if (b.dataset.pulse){ var d=load(); d.pulses.push({t:now(), score:+b.dataset.pulse}); save(); b.parentNode.parentNode.innerHTML='<p>Thanks. Noted.</p>'; }
});

/* ---------- start ---------- */
(function(){
  var d = load();
  if (isNative()){ nudgeSetup(); if (d.profile && d.profile.notify) scheduleNudges(); }
  if ('serviceWorker' in navigator && !isNative() && location.protocol === 'https:'){ try{ navigator.serviceWorker.register('sw.js'); }catch(e){} }
  if (d.profile && d.profile.push && webPushOK() && Notification.permission === 'granted') pushOn();
  window.addEventListener('hashchange', route);
  /* A tapped reminder tells the open app which screen to show. */
  try{ if ('serviceWorker' in navigator) navigator.serviceWorker.addEventListener('message', function(ev){ if (ev.data && ev.data.reset){ location.hash = ev.data.reset; route(); } }); }catch(e){}
  route();
  function route(){
    var h = location.hash, dd = load();
    if (h === '#checkin' || h === '#did' || h.indexOf('#nudge-') === 0){ try{ history.replaceState(null, '', location.pathname); }catch(e){} }
    if (h.indexOf('#nudge-') === 0 && dd.profile) return nudgeScreen(parseInt(h.slice(7), 10) || 0);
    if (h === '#checkin' && dd.profile) return Screens.checkin();
    if (h === '#did' && dd.profile) return nudgeDone();
    dd.profile ? Screens.home() : Screens.welcome();
  }
})();
</script>
